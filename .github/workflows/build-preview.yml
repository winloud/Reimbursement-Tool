name: Build Preview Artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target semver to bind the preview to. Leave empty to read docs/releases/active-plan.md."
        required: false
        default: ""
      preview_serial:
        description: "Optional three-digit daily preview serial. Leave empty to auto-increment from existing artifacts."
        required: false
        default: ""
      release_date:
        description: "Optional yyyymmdd date. Leave empty to use the current China date."
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  preview:
    name: Build preview ZIP artifact
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve preview metadata
        id: preview
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.version }}".Trim()
          $serial = "${{ inputs.preview_serial }}".Trim()
          $releaseDate = "${{ inputs.release_date }}".Trim()

          if ([string]::IsNullOrWhiteSpace($version)) {
            $activePlan = Get-Content -Raw -LiteralPath "docs/releases/active-plan.md"
            if ($activePlan -notmatch "版本号：v?(\d+\.\d+\.\d+)") {
              throw "Cannot resolve target version from docs/releases/active-plan.md."
            }
            $version = $Matches[1]
          }
          if ($version -notmatch "^\d+\.\d+\.\d+$") {
            throw "version must use X.Y.Z format."
          }

          if ([string]::IsNullOrWhiteSpace($releaseDate)) {
            $chinaTimeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("China Standard Time")
            $releaseDate = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $chinaTimeZone).ToString("yyyyMMdd")
          }
          if ($releaseDate -notmatch "^\d{8}$") {
            throw "release_date must use yyyymmdd format."
          }

          if ([string]::IsNullOrWhiteSpace($serial)) {
            $escapedVersion = [regex]::Escape($version)
            $artifactPattern = "^reimbursement-tool-v$escapedVersion-preview-$releaseDate-(\d{3})$"
            $headers = @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $maxSerial = 0
            for ($page = 1; $page -le 10; $page += 1) {
              $uri = "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100&page=$page"
              $response = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
              foreach ($artifact in @($response.artifacts)) {
                if ($artifact.name -match $artifactPattern) {
                  $maxSerial = [Math]::Max($maxSerial, [int]$Matches[1])
                }
              }
              if (@($response.artifacts).Count -lt 100) {
                break
              }
            }
            if ($maxSerial -ge 999) {
              throw "No preview serials are available for $releaseDate."
            }
            $serial = "{0:D3}" -f ($maxSerial + 1)
          }
          elseif ($serial -notmatch "^\d{3}$") {
            throw "preview_serial must be a three-digit daily serial, for example 001."
          }

          $previewId = "preview-$releaseDate-$serial"
          $previewVersion = "$version-$previewId"
          $artifactBaseName = "reimbursement-tool-v$version-$previewId"

          "PREVIEW_TARGET_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PREVIEW_SERIAL=$serial" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_DATE=$releaseDate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PREVIEW_ID=$previewId" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PREVIEW_VERSION=$previewVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ARTIFACT_BASE_NAME=$artifactBaseName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "artifact_name=$artifactBaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-packaging.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -q
          node --test frontend/src/pages/reportEditUtils.test.js
          node --test frontend/src/pages/settingsPageUtils.test.js
          node --test frontend/src/pages/dashboardUtils.test.js
          node --test frontend/src/pages/maintenanceUtils.test.js
          node --test frontend/src/pages/reportListUtils.test.js
          node --test frontend/src/api/client.test.js
          node --test frontend/src/api/reportFilters.test.js

      - name: Build preview ZIP
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:PREVIEW_TARGET_VERSION)) {
            & .\scripts\build_release.ps1 `
              -PreviewBuild `
              -PreviewSerial $env:PREVIEW_SERIAL `
              -ReleaseDate $env:RELEASE_DATE `
              -Version $env:PREVIEW_TARGET_VERSION
          }
          else {
            & .\scripts\build_release.ps1 `
              -PreviewBuild `
              -PreviewSerial $env:PREVIEW_SERIAL `
              -ReleaseDate $env:RELEASE_DATE
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Preview build failed with exit code $LASTEXITCODE."
          }

      - name: Prepare upload artifact
        id: prepare
        shell: pwsh
        run: |
          $previewZip = Get-ChildItem -LiteralPath "release" -Filter "*.zip" |
            Where-Object { $_.Name -like "*$env:PREVIEW_ID*" -and $_.Name -notlike "reimbursement-tool-*" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $previewZip) {
            throw "Preview ZIP was not generated for $env:PREVIEW_ID."
          }

          $payloadRoot = Join-Path "release" "preview-artifact-payload"
          if (Test-Path -LiteralPath $payloadRoot) {
            Remove-Item -LiteralPath $payloadRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $payloadRoot -Force | Out-Null
          Expand-Archive -LiteralPath $previewZip.FullName -DestinationPath $payloadRoot -Force

          $manifest = Get-ChildItem -LiteralPath $payloadRoot -Filter "portable-release.json" -Recurse |
            Select-Object -First 1
          if (-not $manifest) {
            throw "Expanded preview artifact payload is missing portable-release.json."
          }

          "artifact_path=release/preview-artifact-payload/*" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_name=$env:ARTIFACT_BASE_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ steps.prepare.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
