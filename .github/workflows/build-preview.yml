name: Build Preview Artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target semver to bind the preview to. Leave empty to read docs/releases/active-plan.md."
        required: false
        default: ""
      preview_serial:
        description: "Optional three-digit daily preview serial. Leave empty to auto-increment from existing artifacts."
        required: false
        default: ""
      release_date:
        description: "Optional yyyymmdd date. Leave empty to use the current China date."
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  preview:
    name: Build preview NSIS artifact
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve preview metadata
        id: preview
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.version }}".Trim()
          $serial = "${{ inputs.preview_serial }}".Trim()
          $releaseDate = "${{ inputs.release_date }}".Trim()

          if ([string]::IsNullOrWhiteSpace($version)) {
            $activePlan = Get-Content -Raw -LiteralPath "docs/releases/active-plan.md"
            if ($activePlan -notmatch "版本号：v?(\d+\.\d+\.\d+)") {
              throw "Cannot resolve target version from docs/releases/active-plan.md."
            }
            $version = $Matches[1]
          }
          if ($version -notmatch "^\d+\.\d+\.\d+$") {
            throw "version must use X.Y.Z format."
          }

          if ([string]::IsNullOrWhiteSpace($releaseDate)) {
            $chinaTimeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("China Standard Time")
            $releaseDate = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $chinaTimeZone).ToString("yyyyMMdd")
          }
          if ($releaseDate -notmatch "^\d{8}$") {
            throw "release_date must use yyyymmdd format."
          }

          if ([string]::IsNullOrWhiteSpace($serial)) {
            $escapedVersion = [regex]::Escape($version)
            $artifactPattern = "^reimbursement-tool-v$escapedVersion-preview-$releaseDate-(\d{3})$"
            $headers = @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $maxSerial = 0
            for ($page = 1; $page -le 10; $page += 1) {
              $uri = "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100&page=$page"
              $response = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
              foreach ($artifact in @($response.artifacts)) {
                if ($artifact.name -match $artifactPattern) {
                  $maxSerial = [Math]::Max($maxSerial, [int]$Matches[1])
                }
              }
              if (@($response.artifacts).Count -lt 100) {
                break
              }
            }
            if ($maxSerial -ge 999) {
              throw "No preview serials are available for $releaseDate."
            }
            $serial = "{0:D3}" -f ($maxSerial + 1)
          }
          elseif ($serial -notmatch "^\d{3}$") {
            throw "preview_serial must be a three-digit daily serial, for example 001."
          }

          $previewId = "preview-$releaseDate-$serial"
          $artifactBaseName = "reimbursement-tool-v$version-$previewId"

          "PREVIEW_TARGET_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_DATE=$releaseDate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PREVIEW_ID=$previewId" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ARTIFACT_BASE_NAME=$artifactBaseName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "artifact_name=$artifactBaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-packaging.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: tauri-preview-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: tauri-preview-${{ runner.os }}-

      - name: Install Tauri CLI
        shell: pwsh
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri --version

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install -r backend/requirements-packaging.txt

      - name: Run backend tests
        run: python -m pytest -q

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Run desktop shell checks
        shell: pwsh
        run: |
          & .\scripts\verify.ps1 -Profile Desktop
          if (-not $?) {
            throw "Desktop verification profile failed."
          }

      - name: Build preview NSIS
        shell: pwsh
        env:
          TAURI_PRIVATE_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # 预览包同样签名，便于验证 updater 升级路径；未配置密钥时构建脚本跳过签名。
          if ($env:TAURI_PRIVATE_KEY_B64) {
            [System.IO.File]::WriteAllBytes(
              "$env:GITHUB_WORKSPACE\.tauri-key",
              [System.Convert]::FromBase64String($env:TAURI_PRIVATE_KEY_B64)
            )
            $env:TAURI_SIGNING_PRIVATE_KEY_PATH = "$env:GITHUB_WORKSPACE\.tauri-key"
          }
          & .\scripts\build_tauri_release.ps1 `
            -Version $env:PREVIEW_TARGET_VERSION `
            -ReleaseDate $env:RELEASE_DATE
          if ($LASTEXITCODE -ne 0) {
            throw "Preview build failed with exit code $LASTEXITCODE."
          }

      - name: Prepare upload artifact
        id: prepare
        shell: pwsh
        run: |
          $nsisDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\release\bundle\nsis"
          $setupExe = Get-ChildItem -LiteralPath $nsisDir -Filter "*-setup.exe" |
            Where-Object { $_.Name -notlike "*.sig" } |
            Select-Object -First 1
          if (-not $setupExe) {
            throw "Preview NSIS setup exe was not generated for $env:PREVIEW_ID."
          }

          $payloadRoot = Join-Path "release" "preview-artifact-payload"
          if (Test-Path -LiteralPath $payloadRoot) {
            Remove-Item -LiteralPath $payloadRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $payloadRoot -Force | Out-Null

          # 预览包名带 preview id，避免与正式资产混淆。
          $previewName = "{0}-{1}-setup.exe" -f $env:ARTIFACT_BASE_NAME, "x64"
          Copy-Item -LiteralPath $setupExe.FullName -Destination (Join-Path $payloadRoot $previewName)
          $sigPath = "$($setupExe.FullName).sig"
          if (Test-Path -LiteralPath $sigPath) {
            Copy-Item -LiteralPath $sigPath -Destination (Join-Path $payloadRoot "$previewName.sig")
          }
          foreach ($feedName in @("latest.json", "data-compat.json")) {
            $feedPath = Join-Path $env:GITHUB_WORKSPACE "dist-feed\$feedName"
            if (Test-Path -LiteralPath $feedPath) {
              Copy-Item -LiteralPath $feedPath -Destination (Join-Path $payloadRoot $feedName)
            }
          }

          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $setupExe.FullName).Hash.ToLowerInvariant()
          "$sha256  $previewName" | Set-Content -LiteralPath (Join-Path $payloadRoot "SHA256SUMS.txt") -Encoding ascii

          "artifact_path=release/preview-artifact-payload/*" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_name=$env:ARTIFACT_BASE_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ steps.prepare.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
