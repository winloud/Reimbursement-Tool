[package]
name = "reimbursement-tauri"
version = "2.0.0"
description = "出差旅费报销管理工具桌面壳"
edition = "2021"
rust-version = "1.77"

[lib]
name = "reimbursement_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
default = []
